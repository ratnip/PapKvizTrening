<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pap Quiz</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #000;
        color: #eee;
    }

    .sticky-header {
        position: sticky;
        top: 0;
        background: #111;
        z-index: 1000;
        padding: 10px;
        border-bottom: 1px solid #333;
    }

    h2, h3, p, span, label {
        color: #eee;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 10px;
    }

    .controls button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #2e7d32; /* green */
        color: #fff;
    }

    .controls button.off {
        background-color: #b71c1c; /* red */
    }

    #question-list {
        padding: 20px;
    }

    button {
        font-size: 1.1em;
        padding: 10px 15px;
        margin: 5px 0;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #1565c0;
        color: white;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #0d47a1;
    }

    button:disabled {
        background-color: #555;
        cursor: not-allowed;
    }

    .question-container button {
        margin-right: 10px;
    }

    .next-question-container {
        display: flex;
        justify-content: flex-start;
        margin-top: 10px;
    }

    hr {
        border: 1px solid #333;
        margin: 20px 0;
    }

    input {
        background: #222;
        color: #eee;
        border: 1px solid #555;
    }
</style>
</head>
<body>
    <div class="sticky-header">
        <h2>Pap Kviz Trening!</h2>
        <div class="controls">
            <span>Set:</span>
            <button class="toggle on" data-range="1-400">1</button>
            <button class="toggle on" data-range="401-800">2</button>
			<button class="toggle on" data-range="801-1200">3</button>
            <button class="toggle on" data-range="1201-1600">4</button>
			<button class="toggle on" data-range="1601-2000">5</button>
			<button class="toggle on" data-range="2001-2400">6</button>
            <label for="batch-size">Novih:</label>
            <input id="batch-size" type="number" min="1" max="1000" value="1" style="width:4.5em;" />
        </div>
    </div>
    <div id="question-list"></div>

    <script>
        let questionCount = 0;

        async function loadCSV(file) {
            const response = await fetch(file);
            const data = await response.text();
            return data.split('\n').slice(1)
                .map(row => row.split(';').map(cell => cell.trim()))
                .filter(columns => columns.length === 4)
                .map(([Rbr, Tekst, Odgovor, Tezina]) => ({ Rbr: parseInt(Rbr), Tekst, Odgovor, Tezina: parseInt(Tezina) }));
        }

        function getRandomQuestion(questions, selectedRanges, playedQuestions) {
            const filteredQuestions = questions.filter(q => 
                selectedRanges.some(([min, max]) => q.Rbr >= min && q.Rbr <= max) &&
                !playedQuestions.has(q.Tekst)
            );
            if (filteredQuestions.length === 0) return null;
            const randomQuestion = filteredQuestions[Math.floor(Math.random() * filteredQuestions.length)];
            playedQuestions.add(randomQuestion.Tekst);
            return randomQuestion;
        }

        function renderQuestion(question, container) {
            questionCount++;
            const questionDiv = document.createElement('div');
            questionDiv.classList.add('question-container');

            const title = document.createElement('h3');
            title.textContent = `${questionCount}. ${question.Tekst}`;
            questionDiv.appendChild(title);

            const revealAnswerButton = document.createElement('button');
            revealAnswerButton.textContent = "Pokaži odgovor";
            revealAnswerButton.onclick = () => {
                const answer = document.createElement('p');
                answer.textContent = `Odgovor: ${question.Odgovor}`;
                questionDiv.appendChild(answer);
                revealAnswerButton.disabled = true;
            };
            questionDiv.appendChild(revealAnswerButton);
			
			const revealNumberButton = document.createElement('button');
            revealNumberButton.textContent = "Broj pitanja";
            revealNumberButton.onclick = () => {
                const number = document.createElement('p');
                number.textContent = `Broj pitanja: ${question.Rbr}`;
                questionDiv.appendChild(number);
                revealNumberButton.disabled = true;
            };
            questionDiv.appendChild(revealNumberButton);

            container.appendChild(questionDiv);
            container.appendChild(document.createElement('hr'));
        }
		
		function autoScrollToBottom() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const questions = await loadCSV('pubquiz2.csv');
            const questionList = document.getElementById('question-list');
            const toggleButtons = document.querySelectorAll('.toggle');
            let selectedRanges = [[1, 400], [401, 800], [801, 1200], [1201, 1600], [1601, 2000], [2001, 2400]];
            let playedQuestions = new Set();

            toggleButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const [min, max] = button.getAttribute('data-range').split('-').map(Number);
                    const rangeIndex = selectedRanges.findIndex(([rMin, rMax]) => rMin === min && rMax === max);
                    if (rangeIndex > -1) {
                        selectedRanges.splice(rangeIndex, 1);
                        button.classList.remove('on');
                        button.classList.add('off');
                    } else {
                        selectedRanges.push([min, max]);
                        button.classList.remove('off');
                        button.classList.add('on');
                    }
                });
            });


            function loadNextQuestion() {
                // Remove any existing "Dalje" button so only the newest (last) one is shown
                document.querySelectorAll('.next-question-container').forEach(el => el.remove());

                // How many questions to show per click (default 1)
                const batchSizeInput = document.getElementById('batch-size');
                let batchSize = parseInt(batchSizeInput?.value, 10);
                if (isNaN(batchSize) || batchSize < 1) batchSize = 1;
                if (batchSize > 1000) batchSize = 1000;

                let added = 0;
                for (let i = 0; i < batchSize; i++) {
                    const question = getRandomQuestion(questions, selectedRanges, playedQuestions);
                    if (!question) {
                        const warning = document.createElement('p');
                        warning.textContent = "Nema više pitanja u odabranim rasponima.";
                        questionList.appendChild(warning);

                        // Still show a single "Dalje" button so the user can continue after changing filters
                        const nextQuestionButtonContainer = document.createElement('div');
                        nextQuestionButtonContainer.classList.add('next-question-container');
                        const nextQuestionButton = document.createElement('button');
                        nextQuestionButton.textContent = "Dalje";
                        nextQuestionButton.onclick = loadNextQuestion;
                        nextQuestionButtonContainer.appendChild(nextQuestionButton);
                        questionList.appendChild(nextQuestionButtonContainer);
                        return;
                    }
                    renderQuestion(question, questionList);
                    added++;
                }

                // Add a single "Dalje" button after the last question in this batch
                if (added > 0) {
                    const nextQuestionButtonContainer = document.createElement('div');
                    nextQuestionButtonContainer.classList.add('next-question-container');
                    const nextQuestionButton = document.createElement('button');
                    nextQuestionButton.textContent = "Dalje";
                    nextQuestionButton.onclick = loadNextQuestion;
                    nextQuestionButtonContainer.appendChild(nextQuestionButton);
                    questionList.appendChild(nextQuestionButtonContainer);
                }
            }

            loadNextQuestion();
        });
    </script>
</body>
</html>
