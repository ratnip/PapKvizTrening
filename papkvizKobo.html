<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pap Kviz (Kobo Toggle)</title>
  <style>
    body{
      margin:0;
      padding:12px;
      background:#000;
      color:#eee;
      font-family:Arial,sans-serif;
      font-size:16px;
      line-height:1.35;
    }
    .meta{
      margin-bottom:12px;
      padding-bottom:10px;
      border-bottom:1px solid #333;
    }
    .item{ margin: 14px 0; }
    .q{ font-weight:bold; margin:0 0 8px 0; }
    .btn{
      display:inline-block;
      padding:8px 10px;
      border:1px solid #555;
      background:#111;
      color:#eee;
      border-radius:4px;
      font-size:15px;
    }
    .btn:active{ background:#222; }
    .a{
      margin-top:10px;
      padding:10px;
      border-left:3px solid #333;
      background:#0b0b0b;
      color:#ddd;
      display:none; /* hidden by default */
    }
    hr{
      border:0;
      border-top:1px solid #222;
      margin:12px 0;
    }
    .error{ color:#ffb3b3; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="meta" id="meta">Učitavam...</div>
  <div id="list"></div>

  <script>
  (function () {
    var SETS = [
      { n: 1, min: 1,    max: 400  },
      { n: 2, min: 401,  max: 800  },
      { n: 3, min: 801,  max: 1200 },
      { n: 4, min: 1201, max: 1600 },
      { n: 5, min: 1601, max: 2000 }
    ];

    var chosen = SETS[Math.floor(Math.random() * SETS.length)];
    var metaEl = document.getElementById('meta');
    var listEl = document.getElementById('list');

    metaEl.innerHTML = "Set: " + chosen.n + " (" + chosen.min + "–" + chosen.max + ")";

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    function parseCSV(text) {
      var lines = text.split(/\r?\n/);
      var out = [];
      for (var i = 1; i < lines.length; i++) {
        var line = lines[i];
        if (!line) continue;
        var cols = line.split(";");
        if (cols.length < 4) continue;

        var rbr = parseInt((cols[0]||"").trim(), 10);
        var tekst = (cols[1]||"").trim();
        var odgovor = (cols[2]||"").trim();

        if (!rbr || !tekst) continue;
        out.push({ Rbr: rbr, Tekst: tekst, Odgovor: odgovor });
      }
      return out;
    }

    // Kobo-friendly: inline onclick uses this function
    window.koboToggle = function (id, btn) {
      var el = document.getElementById(id);
      if (!el) return;
      if (el.style.display === "none" || el.style.display === "") {
        el.style.display = "block";
        if (btn) btn.innerHTML = "Sakrij odgovor";
      } else {
        el.style.display = "none";
        if (btn) btn.innerHTML = "Pokaži odgovor";
      }
    };

    function renderAll(questions) {
      if (!questions || questions.length === 0) {
        listEl.innerHTML = '<div class="error">Nema pitanja za odabrani set.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < questions.length; i++) {
        var q = questions[i];
        var aid = "a_" + i; // unique id per question

        html += '<div class="item">';
        html +=   '<div class="q">' + (i+1) + '. ' + esc(q.Tekst) + '</div>';
        html +=   '<button class="btn" onclick="koboToggle(\'' + aid + '\', this)">Pokaži odgovor</button>';
        html +=   '<div class="a" id="' + aid + '">Odgovor: ' + esc(q.Odgovor) + '</div>';
        html += '</div>';
        html += '<hr/>';
      }
      listEl.innerHTML = html;
    }

    function loadCSV_xhr(path, onOk, onErr) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", path, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 0) onOk(xhr.responseText);
            else onErr("HTTP status: " + xhr.status);
          }
        };
        xhr.send(null);
      } catch (e) {
        onErr(String(e));
      }
    }

    loadCSV_xhr("pubquiz.csv", function (csvText) {
      var all = parseCSV(csvText);

      var filtered = [];
      for (var i = 0; i < all.length; i++) {
        var r = all[i].Rbr;
        if (r >= chosen.min && r <= chosen.max) filtered.push(all[i]);
      }

      shuffle(filtered);
      metaEl.innerHTML = "Set: " + chosen.n + " (" + chosen.min + "–" + chosen.max + ") · Ukupno: " + filtered.length;

      renderAll(filtered);

    }, function (err) {
      listEl.innerHTML =
        '<div class="error">' +
        'Ne mogu učitati pubquiz.csv.\n' +
        'Provjeri da su HTML i pubquiz.csv u ISTOJ mapi.\n' +
        'Detalji: ' + esc(err) +
        '</div>';
    });
  })();
  </script>
</body>
</html>
